[project]
name = "analisis-videojuego-seed42"
version = "1.0.0"
description = "Pipeline end-to-end de análisis de datos con Python, MySQL, Power BI y n8n"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
